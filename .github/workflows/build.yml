name: Build FFmpeg on macOS

on:
  workflow_dispatch:

jobs:
  macos-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: macos-15-intel

          - arch: aarch64
            os: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: install nasm
        if: matrix.arch == 'x86_64'
        run: |
          brew install nasm
          nasm -v

      - name: build libmp3lame
        run: |
          tar -xzf lame-3.100.tar.gz
          cd lame-3.100

          export MACOSX_DEPLOYMENT_TARGET=12.0

          OPT_CFLAGS="-O3 -fomit-frame-pointer -pipe"

          ./configure \
            --prefix=/usr/local/opt/lame-3.100 \
            --disable-shared \
            --disable-frontend \
            --enable-static \
            CFLAGS="${OPT_CFLAGS}"

          grep -m1 '^CFLAGS' libmp3lame/Makefile

          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: build ffmpeg
        run: |
          wget https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz

          tar -xf ffmpeg-9.0.1.tar.xz
          cd ffmpeg-9.0.1

          export MACOSX_DEPLOYMENT_TARGET=12.0

          ./configure \
            --prefix=/usr/local/opt/ffmpeg \
            --disable-doc \
            --disable-shared \
            --disable-everything \
            --disable-programs \
            --disable-network \
            --disable-avdevice \
            --disable-autodetect \
            --disable-avx512 \
            --enable-demuxer='concat,ffmetadata,mov,mp4,flv,mp3,matroska,image2,ass' \
            --enable-muxer='mp4,ipod,flv,mp3,flac,eac3,matroska' \
            --enable-decoder='h264,hevc,av1,aac,flac,eac3,ac3,mjpeg,png,webp,ass' \
            --enable-encoder='libmp3lame,flac,mjpeg,png,ass' \
            --enable-parser='mjpeg,h264,hevc,av1,aac,flac,ac3,eac3' \
            --enable-bsf=h264_mp4toannexb \
            --enable-swscale \
            --enable-filter='scale,format,null,copy,aresample,aformat,anull' \
            --enable-static \
            --enable-ffmpeg \
            --enable-protocol='file,concat,pipe' \
            --enable-zlib \
            --enable-libmp3lame \
            --enable-gpl \
            --extra-ldflags="-L/usr/local/opt/lame-3.100/lib" \
            --extra-cflags="-I/usr/local/opt/lame-3.100/include" \

          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: verify ffmpeg
        run: |
          /usr/local/opt/ffmpeg/bin/ffmpeg -version

          # configure 遇到不存在的组件名只给一行 WARNING 并继续，产物里就悄悄少了这个组件
          # （曾把 m4a 当成封装器名，实际 .m4a 对应的是 ipod）。这里按 Bili23 实际依赖的
          # 封装器逐个确认，缺一个就让构建失败
          muxers=$(/usr/local/opt/ffmpeg/bin/ffmpeg -hide_banner -muxers | awk '{print $2}')

          for muxer in mp4 ipod flv mp3 flac eac3 matroska; do
            echo "$muxers" | grep -qx "$muxer" || { echo "缺少封装器: $muxer"; exit 1; }
          done

      - name: upload ffmpeg
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-artifact-${{ matrix.arch }}
          path: /usr/local/opt/ffmpeg
