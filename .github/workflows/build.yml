name: Build FFmpeg

on:
  workflow_dispatch:

jobs:
  macos-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: macos-15-intel

          - arch: aarch64
            os: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: install nasm
        if: matrix.arch == 'x86_64'
        run: |
          brew install nasm
          nasm -v

      - name: build libmp3lame
        run: |
          tar -xzf lame-3.100.tar.gz
          cd lame-3.100

          export MACOSX_DEPLOYMENT_TARGET=12.0

          OPT_CFLAGS="-O3 -fomit-frame-pointer -pipe"

          ./configure \
            --prefix=/usr/local/opt/lame-3.100 \
            --disable-shared \
            --disable-frontend \
            --enable-static \
            CFLAGS="${OPT_CFLAGS}"

          grep -m1 '^CFLAGS' libmp3lame/Makefile

          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: build ffmpeg
        run: |
          wget https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz

          tar -xf ffmpeg-9.0.1.tar.xz
          cd ffmpeg-9.0.1

          export MACOSX_DEPLOYMENT_TARGET=12.0

          ./configure \
            --prefix=/usr/local/opt/ffmpeg \
            --disable-doc \
            --disable-shared \
            --disable-everything \
            --disable-programs \
            --disable-network \
            --disable-avdevice \
            --disable-autodetect \
            --disable-avx512 \
            --enable-demuxer='concat,ffmetadata,mov,mp4,flv,mp3,matroska,image2,ass' \
            --enable-muxer='mp4,ipod,flv,mp3,flac,eac3,matroska' \
            --enable-decoder='h264,hevc,av1,aac,flac,eac3,ac3,mjpeg,png,webp,ass' \
            --enable-encoder='libmp3lame,flac,mjpeg,png,ass' \
            --enable-parser='mjpeg,h264,hevc,av1,aac,flac,ac3,eac3' \
            --enable-bsf=h264_mp4toannexb \
            --enable-swscale \
            --enable-filter='scale,format,null,copy,aresample,aformat,anull' \
            --enable-static \
            --enable-ffmpeg \
            --enable-protocol='file,concat,pipe' \
            --enable-zlib \
            --enable-libmp3lame \
            --enable-gpl \
            --extra-ldflags="-L/usr/local/opt/lame-3.100/lib" \
            --extra-cflags="-I/usr/local/opt/lame-3.100/include" \

          make -j$(sysctl -n hw.ncpu)
          sudo make install

      - name: verify ffmpeg
        run: |
          /usr/local/opt/ffmpeg/bin/ffmpeg -version

          # configure 遇到不存在的组件名只给一行 WARNING 并继续，产物里就悄悄少了这个组件
          # （曾把 m4a 当成封装器名，实际 .m4a 对应的是 ipod）。这里按 Bili23 实际依赖的
          # 封装器逐个确认，缺一个就让构建失败
          muxers=$(/usr/local/opt/ffmpeg/bin/ffmpeg -hide_banner -muxers | awk '{print $2}')

          for muxer in mp4 ipod flv mp3 flac eac3 matroska; do
            echo "$muxers" | grep -qx "$muxer" || { echo "缺少封装器: $muxer"; exit 1; }
          done

      - name: upload ffmpeg
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-artifact-${{ matrix.arch }}
          path: /usr/local/opt/ffmpeg

  windows-build:
    # 在 Linux 上用 mingw-w64 交叉编译。本地 MSYS2 的 bash/make 走 Cygwin 的 fork 模拟，
    # configure 要起几千个小进程，慢的是这一层而不是 gcc；换到 Linux 上同一套 GCC 工具链
    # 产物一致，速度快得多
    runs-on: ubuntu-latest

    env:
      HOST: x86_64-w64-mingw32

    steps:
      - uses: actions/checkout@v6

      - name: install toolchain
        run: |
          # libz-mingw-w64-dev 提供交叉编译用的静态 zlib，PNG 编解码（封面嵌入）依赖它
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 libz-mingw-w64-dev nasm make

          ${HOST}-gcc --version | head -1

      - name: build libmp3lame
        run: |
          tar -xzf lame-3.100.tar.gz
          cd lame-3.100

          OPT_CFLAGS="-O3 -fomit-frame-pointer -pipe"

          ./configure \
            --host=${HOST} \
            --prefix=/opt/lame-3.100 \
            --disable-shared \
            --disable-frontend \
            --enable-static \
            CFLAGS="${OPT_CFLAGS}"

          grep -m1 '^CFLAGS' libmp3lame/Makefile

          make -j$(nproc)
          sudo make install

      - name: build ffmpeg
        run: |
          wget https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz

          tar -xf ffmpeg-9.0.1.tar.xz
          cd ffmpeg-9.0.1

          ./configure \
            --cross-prefix=${HOST}- \
            --arch=x86_64 \
            --target-os=mingw32 \
            --prefix=/opt/ffmpeg \
            --disable-doc \
            --disable-shared \
            --disable-everything \
            --disable-programs \
            --disable-network \
            --disable-avdevice \
            --disable-autodetect \
            --disable-avx512 \
            --enable-demuxer='concat,ffmetadata,mov,mp4,flv,mp3,matroska,image2,ass' \
            --enable-muxer='mp4,ipod,flv,mp3,flac,eac3,matroska' \
            --enable-decoder='h264,hevc,av1,aac,flac,eac3,ac3,mjpeg,png,webp,ass' \
            --enable-encoder='libmp3lame,flac,mjpeg,png,ass' \
            --enable-parser='mjpeg,h264,hevc,av1,aac,flac,ac3,eac3' \
            --enable-bsf=h264_mp4toannexb \
            --enable-swscale \
            --enable-filter='scale,format,null,copy,aresample,aformat,anull' \
            --enable-static \
            --enable-ffmpeg \
            --enable-protocol='file,concat,pipe' \
            --enable-zlib \
            --enable-libmp3lame \
            --enable-gpl \
            --extra-ldflags='-static -static-libgcc' \
            --extra-ldflags="-L/opt/lame-3.100/lib" \
            --extra-cflags="-I/opt/lame-3.100/include"

          make -j$(nproc)
          sudo make install

      - name: verify ffmpeg
        run: |
          # 产物是 .exe，Linux 上跑不起来，改为检查编译期的组件表：
          # configure 遇到不存在的组件名只给一行 WARNING 并继续，产物里就悄悄少了这个组件
          for muxer in mp4 ipod flv mp3 flac eac3 matroska; do
            grep -q "^#define CONFIG_${muxer^^}_MUXER 1" ffmpeg-9.0.1/config_components.h || { echo "缺少封装器: $muxer"; exit 1; }
          done

          for component in PNG_ENCODER PNG_DECODER LIBMP3LAME_ENCODER; do
            grep -q "^#define CONFIG_${component} 1" ffmpeg-9.0.1/config_components.h || { echo "缺少组件: $component"; exit 1; }
          done

          # 只允许依赖 Windows 自带的 DLL。漏了 -static 时会冒出 libgcc_s_seh-1.dll、
          # libwinpthread-1.dll 之类，用户机器上没有，FFmpeg 直接起不来
          dlls=$(${HOST}-objdump -p /opt/ffmpeg/bin/ffmpeg.exe | awk '/DLL Name/ {print $3}')
          echo "$dlls"

          if echo "$dlls" | grep -iE '^(lib.*|zlib1)\.dll$'; then
            echo "存在非系统 DLL 依赖"
            exit 1
          fi

      - name: upload ffmpeg
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-artifact-windows-x86_64
          path: /opt/ffmpeg
